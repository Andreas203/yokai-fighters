<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><style>@import url('https://fonts.googleapis.com/css2?family=Yuji+Syuku&amp;family=Shippori+Mincho:wght@400;700&amp;family=Yuji+Boku&amp;family=Zen+Kaku+Gothic+New:wght@400;700&amp;family=Kaisei+Decol:wght@700&amp;family=Noto+Serif+JP:wght@400;700&amp;display=swap');
</style><rect width="1920" height="1080" fill="#2D3A5E"/><rect x="560" y="18" width="800" height="32" rx="0" fill="#B5332B" stroke="none" stroke-width="0"/><text x="960" y="40" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#F1E8D4" text-anchor="middle">ROUGH PROTOTYPE · FONT SPECIMENS 1 of 3 · YOK-71</text><text x="960" y="86" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#F1E8D4" text-anchor="middle">Pairings 1 to 3: free Google Fonts (OFL). Sizes are the 1080p HUD and card sizes.</text><rect x="40" y="100" width="600" height="900" rx="2" fill="#F1E8D4" stroke="#1D1B21" stroke-width="2.5"/><rect x="40" y="100" width="600" height="64" rx="0" fill="#2D3A5E" stroke="none" stroke-width="0"/><text x="52" y="126" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#F1E8D4" text-anchor="start">1  Brush mincho + calm mincho</text><text x="52" y="150" font-family="Georgia, serif" font-size="14" font-weight="400" fill="#C9CFE6" text-anchor="start" font-style="italic">heading: Yuji Syuku   body: Shippori Mincho</text><text x="56" y="260" font-family="'Yuji Syuku', serif" font-size="92" font-weight="400" fill="#1D1B21" text-anchor="start">SHOP</text><rect x="56" y="272" width="224" height="10" rx="3" fill="#B5332B" stroke="none" stroke-width="0"/><text x="56" y="334" font-family="'Yuji Syuku', serif" font-size="52" font-weight="400" fill="#1D1B21" text-anchor="start">REST STOP</text><text x="56" y="376" font-family="'Yuji Syuku', serif" font-size="26" font-weight="400" fill="#D8632C" text-anchor="start">Foxfire Lv 2 · Tanuki target</text><text x="56" y="402" font-family="'Shippori Mincho', serif" font-size="16" font-weight="400" fill="#4A463C" text-anchor="start">Foxfire Lv 2 · Tanuki target</text><rect x="56" y="420" width="568" height="138" rx="3" fill="#F8F1E0" stroke="#1D1B21" stroke-width="2.5"/><rect x="56" y="420" width="568" height="22" rx="0" fill="#B5332B" stroke="none" stroke-width="0"/><text x="68" y="436" font-family="'Shippori Mincho', serif" font-size="12" font-weight="700" fill="#F1E8D4" text-anchor="start">SPECIAL · NEW · Lv 1</text><rect x="68" y="452" width="52" height="52" rx="6" fill="#D8632C" stroke="none" stroke-width="0"/><text x="94" y="488" font-family="'Yuji Syuku', serif" font-size="34" font-weight="400" fill="#F1E8D4" text-anchor="middle">F</text><text x="134" y="482" font-family="'Yuji Syuku', serif" font-size="30" font-weight="400" fill="#1D1B21" text-anchor="start">Foxfire</text><text x="134" y="502" font-family="'Shippori Mincho', serif" font-size="13" font-weight="400" fill="#7A7054" text-anchor="start">Kitsune · special</text><text x="68" y="526" font-family="'Shippori Mincho', serif" font-size="16" font-weight="400" fill="#33302A" text-anchor="start">Throw a slow fireball that lights the way and sets</text><text x="68" y="546" font-family="'Shippori Mincho', serif" font-size="16" font-weight="400" fill="#33302A" text-anchor="start">the copied move's level.</text><rect x="56" y="574" width="568" height="96" rx="14" fill="#F8F1E0" stroke="#1D1B21" stroke-width="3"/><text x="70" y="604" font-family="'Shippori Mincho', serif" font-size="20" font-weight="400" fill="#1D1B21" text-anchor="start">Ah, Slippery Skin: Slick kappa skin makes</text><text x="70" y="630" font-family="'Shippori Mincho', serif" font-size="20" font-weight="400" fill="#1D1B21" text-anchor="start">you impossible to throw while the move</text><text x="70" y="656" font-family="'Shippori Mincho', serif" font-size="20" font-weight="400" fill="#1D1B21" text-anchor="start">starts up.</text><rect x="56" y="684" width="99" height="34" rx="6" fill="#F8F1E0" stroke="#1D1B21" stroke-width="2"/><text x="105.5" y="708" font-family="'Shippori Mincho', serif" font-size="18" font-weight="700" fill="#1D1B21" text-anchor="middle">Tab / Y</text><text x="163" y="708" font-family="'Shippori Mincho', serif" font-size="20" font-weight="400" fill="#1D1B21" text-anchor="start">Frame data</text><rect x="3
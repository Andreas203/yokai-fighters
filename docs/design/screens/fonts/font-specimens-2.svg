<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><style>@import url('https://fonts.googleapis.com/css2?family=Yuji+Boku&amp;family=Zen+Old+Mincho:wght@400;700&amp;family=Sawarabi+Mincho&amp;display=swap');
</style><rect width="1920" height="1080" fill="#2D3A5E"/><rect x="560" y="18" width="800" height="32" rx="0" fill="#B5332B" stroke="none" stroke-width="0"/><text x="960" y="40" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#F1E8D4" text-anchor="middle">ROUGH PROTOTYPE · FONT SPECIMENS 2 of 3 · YOK-71</text><text x="960" y="86" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#F1E8D4" text-anchor="middle">Pairings 4 and 5: licensed brush option (stand-in) and system fallback; plus one more free pair.</text><rect x="40" y="100" width="600" height="900" rx="2" fill="#F1E8D4" stroke="#1D1B21" stroke-width="2.5"/><rect x="40" y="100" width="600" height="64" rx="0" fill="#2D3A5E" stroke="none" stroke-width="0"/><text x="52" y="126" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#F1E8D4" text-anchor="start">4  Licensed brush (NOT rendered: stand-in shown)</text><text x="52" y="150" font-family="Georgia, serif" font-size="14" font-weight="400" fill="#C9CFE6" text-anchor="start" font-style="italic">heading: commercial Japanese brush face   body: Zen Old Mincho (free body)</text><rect x="48" y="170" width="584" height="22" rx="2" fill="#E3D8BD" stroke="#7A7054" stroke-width="1.5" stroke-dasharray="6 5"/><text x="340.0" y="186" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#B5332B" text-anchor="middle">STAND-IN PREVIEW: licensed font not owned, not bought</text><text x="56" y="276" font-family="'Yuji Boku', serif" font-size="92" font-weight="400" fill="#1D1B21" text-anchor="start">SHOP</text><rect x="56" y="288" width="224" height="10" rx="3" fill="#B5332B" stroke="none" stroke-width="0"/><text x="56" y="350" font-family="'Yuji Boku', serif" font-size="52" font-weight="400" fill="#1D1B21" text-anchor="start">REST STOP</text><text x="56" y="392" font-family="'Yuji Boku', serif" font-size="26" font-weight="400" fill="#D8632C" text-anchor="start">Foxfire Lv 2 · Tanuki target</text><text x="56" y="418" font-family="'Zen Old Mincho', serif" font-size="16" font-weight="400" fill="#4A463C" text-anchor="start">Foxfire Lv 2 · Tanuki target</text><rect x="56" y="436" width="568" height="138" rx="3" fill="#F8F1E0" stroke="#1D1B21" stroke-width="2.5"/><rect x="56" y="436" width="568" height="22" rx="0" fill="#B5332B" stroke="none" stroke-width="0"/><text x="68" y="452" font-family="'Zen Old Mincho', serif" font-size="12" font-weight="700" fill="#F1E8D4" text-anchor="start">SPECIAL · NEW · Lv 1</text><rect x="68" y="468" width="52" height="52" rx="6" fill="#D8632C" stroke="none" stroke-width="0"/><text x="94" y="504" font-family="'Yuji Boku', serif" font-size="34" font-weight="400" fill="#F1E8D4" text-anchor="middle">F</text><text x="134" y="498" font-family="'Yuji Boku', serif" font-size="30" font-weight="400" fill="#1D1B21" text-anchor="start">Foxfire</text><text x="134" y="518" font-family="'Zen Old Mincho', serif" font-size="13" font-weight="400" fill="#7A7054" text-anchor="start">Kitsune · special</text><text x="68" y="542" font-family="'Zen Old Mincho', serif" font-size="16" font-weight="400" fill="#33302A" text-anchor="start">Throw a slow fireball that lights the way and sets</text><text x="68" y="562" font-family="'Zen Old Mincho', serif" font-size="16" font-weight="400" fill="#33302A" text-anchor="start">the copied move's level.</text><rect x="56" y="590" width="568" height="96" rx="14" fill="#F8F1E0" stroke="#1D1B21" stroke-width="3"/><text x="70" y="620" font-family="'Zen Old Mincho', serif" font-size="20" font-weight="400" fill="#1D1B21" text-anchor="start">Ah, Slippery Skin: Slick kappa skin makes</text><text x="70" y="646" font-family="'Zen Old Mincho', serif" font-size="20" font-weight="400" fill="#1D1B21" text-anchor="start">you impossible to throw while the move</text><text x="70" y="672" font-family="'Zen Old Mincho', serif" font-size="20" font-weight="400" fill="#1D1B21" text-anchor="start">starts up.</text><rect x="56" y="700" width="99" height="34" rx="6" fill="#F8F1E0" stroke="#1D1B21" stroke-width="2"/><text x="105.5" y="724" font-family="'Zen Old Mincho', serif" font-size="18" font-weight="700" fill="#1D1B21" text-anchor="middle">Tab / Y</text><text x="163" y="724" font-family="'Zen Old Mincho', serif" font-size="20" font-weight="400" fill="#1D1B21" text-anchor="start">Frame data</text><rect x="309" y="700" width="121" height="34" rx="6" fill="#F8F1E0" stroke="#1D1B21" stroke-width="2"/><text x="369.5" y="724" font-family="'Zen Old Mincho', serif" font-size="18" font-weight="700" fill="#1D1B21" text-anchor="middle">Enter / A</text><text x="438" y="724" font-family="'Zen Old Mincho', serif" font-size="20" font-weight="400" fill="#1D1B21" text-anchor="start">Choose</text><text x="56" y="758" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#B5332B" text-anchor="start">Licence</text><text x="56" y="774" font-family="Georgia, serif" font-size="12.5" font-weight="400" fill="#1D1B21" text-anchor="start">Commercial. e.g. Fontworks or Morisawa brush families; game/app embedding licence, price</text><text x="56" y="789" font-family="Georgia, serif" font-size="12.5" font-weight="400" fill="#1D1B21" text-anchor="start">on request, NOT BOUGHT, not verified</text><text x="56" y="812" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#B5332B" text-anchor="start">Latin glyph coverage</text><text x="56" y="828" font-family="Georgia, serif" font-size="12.5" font-weight="400" fill="#1D1B21" text-anchor="start">Latin coverage varies by family and must be checked before purchase; many Japanese brush</text><text x="56" y="843" font-family="Georgia, serif" font-size="12.5" font-weight="400" fill="#1D1B21" text-anchor="start">faces have weak or proportional-only Latin</text><text x="56" y="866" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#B5332B" text-anchor="start">File size</text><text x="56" y="882" font-family="Georgia, serif" font-size="12.5" font-weight="400" fill="#1D1B21" text-anchor="start">unknown until a family is chosen (commercial JP fonts are often 5-20 MB)</text><text x="56" y="905" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#B5332B" text-anchor="start">Read</text><text x="56" y="921" font-family="Georgia, serif" font-size="12.5" font-weight="400" fill="#1D1B21" text-anchor="start" font-style="italic">Stand-in: heading drawn in Yuji Boku, body in Zen Old Mincho. Only worth buying if free</text><text x="56" y="936" font-family="Georgia, serif" font-size="12.5" font-weight="400" fill="#1D1B21" text-anchor="start" font-style="italic">brush faces fall short. The designer owns the purchase.</text><rect x="662" y="100" width="600" height="900" rx="2" fill="#F1E8D4" stroke="#1D1B21" stroke-width="2.5"/><rect x="662" y="100" width="600" height="64" rx="0" fill="#2D3A5E" stroke="none" stroke-width="0"/><text x="674" y="126" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#F1E8D4" text-anchor="start">5  System fallback</text><text x="674" y="150" font-family="Georgia, serif" font-size="14" font-weight="400" fill="#C9CFE6" text-anchor="start" font-style="italic">heading: Georgia (then Yu Mincho / Times)   body: Georgia (same)</text><text x="678" y="260" font-family="Georgia, 'Yu Mincho', 'Times New Roman', serif" font-size="92" font-weight="700" fill="#1D1B21" text-anchor="start">SHOP</text><rect x="678" y="272" width="224" height="10" rx="3" fill="#B5332B" stroke="none" stroke-width="0"/><text x="678" y="334" font-family="Georgia, 'Yu Mincho', 'Times New Roman', serif" font-size="52" font-weight="700" fill="#1D1B21" text-anchor="start">REST STOP</text><text x="678" y="376" font-family="Georgia, 'Yu Mincho', 'Times New Roman', serif" font-size="26" font-weight="700" fill="#D8632C" text-anchor="start">Foxfire Lv 2 · Tanuki target</text><text x="678" y="402" font-family="Georgia, 'Yu Mincho', 'Times New Roman', serif" font-size="16" font-weight="400" fill="#4A463C" text-anchor="start">Foxfire Lv 2 · Tanuki target</text><rect x="678" y="420" width="568" height="138" rx="3" fill="#F8F1E0" stroke="#1D1B21" stroke-width="2.5"/><rect x="678" y="420" width="568" height="22" rx="0" fill="#B5332B" stroke="none" stroke-width="0"/><text x="690" y="436" font-family="Georgia, 'Yu Mincho', 'Times New Roman', serif" font-size="12" font-weight="700" fill="#F1E8D4" text-anchor="start">SPECIAL · NEW · Lv 1</text><rect x="690" y="452" width="52" height="52" rx="6" fill="#D8632C" stroke="none" stroke-width="0"/><text x="716" y="488" font-family="Georgia, 'Yu Mincho', 'Times New Roman', serif" font-size="34" font-weight="700" fill="#F1E8D4" text-anchor="middle">F</text><text x="756" y="482" font-family="Georgia, 'Yu Mincho', 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1D1B21" text-anchor="start">Foxfire</text><text x="756" y="502" font-family="Georgia, 'Yu Mincho', 'Times New Roman', serif" font-size="13" font-weight="400" fill="#7A7054" text-anchor="start">Kitsune · special</text><text x="690" y="526" font-family="Georgia, 'Yu Mincho', 'Times New Roman', serif" font-size="16" font-weight="400" fill="#33302A" text-anchor="start">Throw a slow fireball that lights the way and sets</text><text x="690" y="546" font-family="Georgia, 'Yu Mincho', 'Times New Roman', serif" font-size="16" font-weight="400" fill="#33302A" text-anchor="start">the copied move's level.</text><rect x="678" y="574" width="568" height="96" rx="14" fill="#F8F1E0" stroke="#1D1B21" stroke-width="3"/><text x="692" y="604" font-family="Georgia, 'Yu Mincho', 'Times New Roman', serif" font-size="20" font-weight="400" fill="#1D1B21" text-anchor="start">Ah, Slippery Skin: Slick kappa skin makes</text><text x="692" y="630" font-family="Georgia, 'Yu Mincho', 'Times New Roman', serif" font-size="20" font-weight="400" fill="#1D1B21" text-anchor="start">you impossible to throw while the move</text><text x="692" y="656" font-family="Georgia, 'Yu Mincho', 'Times New Roman', serif" font-size="20" font-weight="400" fill="#1D1B21" text-anchor="start">starts up.</text><rect x="678" y="684" width="99" height="34" rx="6" fill="#F8F1E0" stroke="#1D1B21" stroke-width="2"/><text x="727.5" y="708" font-family="Georgia, 'Yu Mincho', 'Times New Roman', serif" font-size="18" font-weight="700" fill="#1D1B21" text-anchor="middle">Tab / Y</text><text x="785" y="708" font-family="Georgia, 'Yu Mincho', 'Times New Roman', serif" font-size="20" font-weight="400" fill="#1D1B21" text-anchor="start">Frame data</text><rect x="931" y="684" width="121" height="34" rx="6" fill="#F8F1E0" stroke="#1D1B21" stroke-width="2"/><text x="991.5" y="708" font-family="Georgia, 'Yu Mincho', 'Times New Roman', serif" font-size="18" font-weight="700" fill="#1D1B21" text-anchor="middle">Enter / A</text><text x="1060" y="708" font-family="Georgia, 'Yu Mincho', 'Times New Roman', serif" font-size="20" font-weight="400" fill="#1D1B21" text-anchor="start">Choose</text><text x="678" y="742" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#B5332B" text-anchor="start">Licence</text><text x="678" y="758" font-family="Georgia, serif" font-size="12.5" font-weight="400" fill="#1D1B21" text-anchor="start">OS-bundled, no licence to ship (Godot SystemFont); not guaranteed on every PC</text><text x="678" y="781" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#B5332B" text-anchor="start">Latin glyph coverage</text><text x="678" y="797" font-family="Georgia, serif" font-size="12.5" font-weight="400" fill="#1D1B21" text-anchor="start">Latin: full. Japanese falls to the OS face (Yu Mincho on Windows, Hiragino on macOS), so</text><text x="678" y="812" font-family="Georgia, serif" font-size="12.5" font-weight="400" fill="#1D1B21" text-anchor="start">kana and kanji change look per machine</text><text x="678" y="835" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#B5332B" text-anchor="start">File size</text><text x="678" y="851" font-family="Georgia, serif" font-size="12.5" font-weight="400" fill="#1D1B21" text-anchor="start">0 MB bundled</text><text x="678" y="874" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#B5332B" text-anchor="start">Read</text><text x="678" y="890" font-family="Georgia, serif" font-size="12.5" font-weight="400" fill="#1D1B21" text-anchor="start" font-style="italic">What the rough mockups use. Ships nothing, but looks different per machine and has no</text><text x="678" y="905" font-family="Georgia, serif" font-size="12.5" font-weight="400" fill="#1D1B21" text-anchor="start" font-style="italic">brush character; keep as the last fallback only.</text><rect x="1284" y="100" width="600" height="900" rx="2" fill="#F1E8D4" stroke="#1D1B21" stroke-width="2.5"/><rect x="1284" y="100" width="600" height="64" rx="0" fill="#2D3A5E" stroke="none" stroke-width="0"/><text x="1296" y="126" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#F1E8D4" text-anchor="start">Also tried: Zen Old Mincho + Sawarabi Mincho</text><text x="1296" y="150" font-family="Georgia, serif" font-size="14" font-weight="400" fill="#C9CFE6" text-anchor="start" font-style="italic">quiet all-mincho pair, little brush character</text><text x="1300" y="260" font-family="'Zen Old Mincho', serif" font-size="92" font-weight="700" fill="#1D1B21" text-anchor="start">SHOP</text><text x="1300" y="330" font-family="'Zen Old Mincho', serif" font-size="52" font-weight="700" fill="#1D1B21" text-anchor="start">REST STOP</text><text x="1300" y="372" font-family="'Zen Old Mincho', serif" font-size="26" font-weight="700" fill="#D8632C" text-anchor="start">Foxfire Lv 2 · Tanuki target</text><text x="1300" y="400" font-family="'Sawarabi Mincho', serif" font-size="16" font-weight="400" fill="#4A463C" text-anchor="start">Foxfire Lv 2 · Tanuki target</text><text x="1300" y="446" font-family="'Zen Old Mincho', serif" font-size="30" font-weight="700" fill="#1D1B21" text-anchor="start">Foxfire</text><text x="1300" y="472" font-family="'Sawarabi Mincho', serif" font-size="16" font-weight="400" fill="#1D1B21" text-anchor="start">Throw a slow fireball that lights the way and sets</text><text x="1300" y="492" font-family="'Sawarabi Mincho', serif" font-size="16" font-weight="400" fill="#1D1B21" text-anchor="start">the copied move's level.</text><text x="1300" y="530" font-family="'Sawarabi Mincho', serif" font-size="20" font-weight="400" fill="#1D1B21" text-anchor="start">Ah, Slippery Skin: Slick kappa skin makes</text><text x="1300" y="556" font-family="'Sawarabi Mincho', serif" font-size="20" font-weight="400" fill="#1D1B21" text-anchor="start">you impossible to throw while the move</text><text x="1300" y="582" font-family="'Sawarabi Mincho', serif" font-size="20" font-weight="400" fill="#1D1B21" text-anchor="start">starts up.</text><text x="1300" y="640" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#B5332B" text-anchor="start">Licence</text><text x="1300" y="656" font-family="Georgia, serif" font-size="12.5" font-weight="400" fill="#1D1B21" text-anchor="start">OFL 1.1. Latin ASCII 95/95. Sawarabi lacks en/em dash and arrows (use hyphen). Full TTF</text><text x="1300" y="671" font-family="Georgia, serif" font-size="12.5" font-weight="400" fill="#1D1B21" text-anchor="start">5.4 MB + 3.7 MB; Latin subset 39 KB + 35 KB.</text><text x="1300" y="740" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#B5332B" text-anchor="start">How the samples are drawn</text><text x="1300" y="756" font-family="Georgia, serif" font-size="12.5" font-weight="400" fill="#1D1B21" text-anchor="start">Specimen text is drawn upright. These families ship no italic, so the game would show</text><text x="1300" y="771" font-family="Georgia, serif" font-size="12.5" font-weight="400" fill="#1D1B21" text-anchor="start">merchant lines upright (a browser would fake an oblique, which is why the mockups look</text><text x="1300" y="786" font-family="Georgia, serif" font-size="12.5" font-weight="400" fill="#1D1B21" text-anchor="start">slanted). Japanese glyphs are not shown here; all listed families cover kana and at least</text><text x="1300" y="801" font-family="Georgia, serif" font-size="12.5" font-weight="400" fill="#1D1B21" text-anchor="start">6.7k kanji except Sawarabi (3.3k).</text></svg>
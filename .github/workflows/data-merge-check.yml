name: data-merge-check
# YOK-34: a pull request that touches data/ runs the data merge check (docs/process/data-merge-check.md):
# schema -> rules -> whole-run harness (200 runs) -> headless test suite, after a fresh build,
# stopping at the first failure. The verdict is advisory. Nothing here merges: the designer reviews
# and merges every PR.
#   MERGEABLE (0)         job passes with a notice
#   REVIEW (3)            job passes with a warning: the PR also changes code and goes to code review
#   NOTHING TO MERGE (5)  job passes with a notice: no file changed
#   FAIL (1) / SETUP (2) / INCOMPLETE (4)  job fails, the report says why
# The checkout stays clean until the check has read its scope: the base checker, Godot, the report and
# the suite log all live in $RUNNER_TEMP, outside the workspace (a dirty tree outside data/ is SETUP).
on:
  pull_request:
    paths: ["data/**"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2
  # SHA-256 of Godot_v4.7.2-stable_mono_linux_x86_64.zip, as in ci.yml: the digest GitHub lists for the asset on
  # the godotengine/godot-builds 4.7.2-stable release, cross-checked against the release's SHA512-SUMS.txt.
  # Change it together with GODOT_VERSION.
  GODOT_ZIP_SHA256: 129f82db7bafd54ae14bb5bb284041c73860e8c7a009a3a026ca5e946cbff247

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # the check diffs the PR against its base to tell data-only from code

      - name: Paths outside the checkout
        run: |
          echo "GODOT_DIR=$RUNNER_TEMP/godot-bin" >> "$GITHUB_ENV"
          echo "GODOT_ZIP_DIR=$RUNNER_TEMP/godot-zip" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/data-merge"

      # YOK-202: the Godot cache is restored FIRST, before the base checker exists on disk. A PR can save a
      # crafted cache under this key in its own PR scope, and actions/cache extracts with tar -P, so a cache
      # restored after the extraction could overwrite the base checker. Only the release zip is cached, and
      # it is checked against GODOT_ZIP_SHA256 before use: a hit that does not match fails the job.
      - name: Restore Godot
        id: godot-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.GODOT_ZIP_DIR }}
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-zip-${{ env.GODOT_ZIP_SHA256 }}

      - name: Download and verify Godot
        env:
          HIT: ${{ steps.godot-cache.outputs.cache-hit }}
        run: |
          zip="$GODOT_ZIP_DIR/godot.zip"
          if [ "$HIT" = true ]; then
            if ! echo "${GODOT_ZIP_SHA256}  $zip" | sha256sum -c -; then
              echo "::error::The cached Godot zip does not match the pinned SHA-256: the cache was tampered with. Delete it (gh cache delete) and re-run."
              exit 1
            fi
          else
            rm -rf "$GODOT_ZIP_DIR" && mkdir -p "$GODOT_ZIP_DIR"
            base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
            curl -fsSL -o "$zip" "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
            echo "${GODOT_ZIP_SHA256}  $zip" | sha256sum -c -
          fi
          # Extract fresh from the verified zip, never into anything a cache may have left behind.
          rm -rf "$GODOT_DIR" && mkdir -p "$GODOT_DIR"
          unzip -q "$zip" -d "$GODOT_DIR"

      # Saves only the verified zip, and before any step that runs PR code.
      - name: Save Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.GODOT_ZIP_DIR }}
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-zip-${{ env.GODOT_ZIP_SHA256 }}

      - name: Locate Godot
        run: echo "GODOT=$GODOT_DIR/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"

      # The checker and its validators come from the BASE branch, never from the PR: a PR could otherwise
      # edit tools/ to call itself mergeable. They are extracted outside the checkout and run on the PR's
      # data/ with --tools. (Any change to tools/ or game/ is itself a code change: REVIEW at best.)
      # The folder is emptied first, so nothing restored earlier can sit inside it, and its contents are
      # hashed: the check step re-hashes them and refuses to run if anything changed in between (YOK-202).
      - name: Extract the base branch's checker
        id: base-checker
        run: |
          base="origin/${GITHUB_BASE_REF:-main}"
          rm -rf "$RUNNER_TEMP/base" && mkdir -p "$RUNNER_TEMP/base"
          git archive "$base" tools | tar -x -C "$RUNNER_TEMP/base"
          if [ -f "$RUNNER_TEMP/base/tools/data_merge_check.py" ]; then
            tools="$RUNNER_TEMP/base/tools"
            echo "CHECKER=base" >> "$GITHUB_ENV"
          else
            # Bootstrap: the base has no checker yet (the PR that adds it). Run the PR's, never as a merge verdict.
            echo "::warning::The base branch has no tools/data_merge_check.py; running the PR's own checker, verdict capped at REVIEW"
            tools="$GITHUB_WORKSPACE/tools"
            echo "CHECKER=pr" >> "$GITHUB_ENV"
          fi
          echo "TOOLS=$tools" >> "$GITHUB_ENV"
          # Every path with its type, mode and link target, then every file's content.
          h=$(cd "$tools" && { find . -printf '%y %m %p -> %l\n' | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | cut -d' ' -f1)
          echo "tools_sha256=$h" >> "$GITHUB_OUTPUT"
          echo "checker files hashed: $h"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install the schema validator
        run: pip install -r "$TOOLS/requirements.txt"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      # Defaults only: 200 runs and a fresh build + import (designer 2026-10-17: anything less is INCOMPLETE).
      - name: Data merge check
        env:
          TOOLS_SHA256: ${{ steps.base-checker.outputs.tools_sha256 }}
        run: |
          # YOK-202: the checker must be the files hashed right after extraction, byte for byte.
          now=$(cd "$TOOLS" && { find . -printf '%y %m %p -> %l\n' | LC_ALL=C sort; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum; } | sha256sum | cut -d' ' -f1)
          if [ "$now" != "$TOOLS_SHA256" ]; then
            echo "::error::The checker's files changed after they were extracted (hash $now, expected $TOOLS_SHA256); not running it"
            exit 1
          fi
          base="origin/${GITHUB_BASE_REF:-main}"
          set +e
          # -I: the checker imports nothing from the checkout. The PR's game code runs inside this step
          # (harness, suite), so it gets no runner file command: it cannot write the summary, env, path,
          # outputs or state of later steps. The summary is written in its own step below.
          out="$RUNNER_TEMP/data-merge"
          env -u GITHUB_STEP_SUMMARY -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_OUTPUT -u GITHUB_STATE \
            python -I "$TOOLS/data_merge_check.py" --root "$GITHUB_WORKSPACE" --tools "$TOOLS" \
            --base "$base" --report "$out/data-merge-report.txt" --suite-log "$out/data-merge-suite.log"
          code=$?
          set -e
          if [ "$CHECKER" = pr ] && [ "$code" = 0 ]; then code=3; fi
          case $code in
            0) echo "::notice::Data merge check: MERGEABLE (verdict only; the designer reviews and merges)";;
            3) echo "::warning::Data merge check passed, but the PR also changes code: it goes to code review";;
            5) echo "::notice::Data merge check: nothing to merge (no file changed)";;
            *) echo "::error::Data merge check did not pass (exit $code); see the report"; exit 1;;
          esac

      - name: Job summary from the report
        if: always()
        run: |
          # A literal path, never one read from env: the check step ran the PR's game code.
          report="$RUNNER_TEMP/data-merge/data-merge-report.txt"
          if [ -f "$report" ]; then
            { echo '```'; cat "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Data merge check wrote no report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: data-merge-report
          path: |
            ${{ runner.temp }}/data-merge/data-merge-report.txt
            ${{ runner.temp }}/data-merge/data-merge-suite.log
          if-no-files-found: ignore

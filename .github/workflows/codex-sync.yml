name: codex-sync
on:
  pull_request:
    paths:
      - ".claude/agents/**"
      - ".claude/skills/**"
      - ".codex/agents/**"
      - ".agents/skills/**"
      - "tools/sync_codex.py"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/sync_codex.py --check
